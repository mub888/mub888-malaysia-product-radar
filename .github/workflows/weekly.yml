name: Weekly Malaysia Product Radar

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * 1" # Monday 09:00 Asia/Kuala_Lumpur (UTC+8)

permissions:
  contents: write

jobs:
  collect-and-rank:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m radar
        env:
          RADAR_MODE: provider
          PROVIDER_ENDPOINT: ${{ secrets.PROVIDER_ENDPOINT }}
          PROVIDER_TOKEN: ${{ secrets.PROVIDER_TOKEN }}
          RESULTS_PER_QUERY: "50"
          TOP_N: "20"
      - name: Commit weekly evidence and report
        run: |
          git config user.name "product-radar-bot"
          git config user.email "product-radar-bot@users.noreply.github.com"
          git add output/
          git diff --cached --quiet || git commit -m "data: weekly Malaysia product radar"
          git push
